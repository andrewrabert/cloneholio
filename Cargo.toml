[package]
name = "cloneholio"
version = "0.17.0"
edition = "2024"
description = "Maintain local backups of all Git repositories belonging to a user or group"
license = "MIT"
repository = "https://github.com/andrewrabert/cloneholio"

[dependencies]
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
futures = "0.3"
indicatif = "0.18"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[build-dependencies]
vergen-gix = { version = "10", features = ["emit_and_set"] }
